# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo
#
# After first deploy, set CORS / frontend URL env vars to your real
# *.onrender.com URLs (or custom domains), then redeploy the API.

services:
  # ── Backend (Express + MySQL) ─────────────────────────────────────────────
  - type: web
    name: nova-api
    runtime: node
    plan: free
    region: oregon
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set to https://nova-frontend.onrender.com (or your custom domain)
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # External MySQL (Aiven, PlanetScale, Railway, self-hosted, etc.)
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: nova_ai
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID_ALT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ASSISTANT_ID
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: N8N_USER
        sync: false
      - key: N8N_PASSWORD
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_METHOD
        value: GET
      - key: N8N_MAIN_WEBHOOK
        sync: false
      - key: N8N_FOLLOWUP_1_WEBHOOK
        sync: false
      - key: N8N_FOLLOWUP_2_WEBHOOK
        sync: false
      - key: N8N_FOLLOWUP_3_WEBHOOK
        sync: false
      - key: N8N_FOLLOWUP_4_WEBHOOK
        sync: false

  # ── Frontend (Vite React static site) ─────────────────────────────────────
  - type: web
    name: nova-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback for react-router
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
    envVars:
      # https://nova-api.onrender.com (no trailing slash)
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false
      - key: REACT_APP_GOOGLE_CLIENT_ID_ALT
        sync: false
      - key: REACT_APP_RECAPTCHA_SITE_KEY
        sync: false
