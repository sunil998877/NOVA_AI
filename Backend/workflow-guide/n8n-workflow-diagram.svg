<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1380" viewBox="0 0 620 1380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#faf7f8"/>
    </linearGradient>
  </defs>

  <rect width="620" height="1380" rx="16" fill="url(#bg)" stroke="#e6e6e6" stroke-width="2"/>

  <text x="310" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#141414">n8n Canvas — "NOVA campaign send"</text>
  <text x="310" y="62" text-anchor="middle" font-size="12" fill="#666">start branch · one workflow run sends to all recipients</text>

  <!-- Node 1 Webhook -->
  <rect x="110" y="92" width="400" height="78" rx="12" fill="#8549C6"/>
  <text x="130" y="118" font-size="14" font-weight="700" fill="#fff">1 · Webhook</text>
  <text x="130" y="140" font-size="11" fill="#f3e6ff">GET · Path: Fixed UUID · Authentication: Basic Auth</text>
  <text x="130" y="156" font-size="11" fill="#f3e6ff">Respond: When Last Node Finishes</text>

  <line x1="310" y1="170" x2="310" y2="210" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2 Switch -->
  <rect x="110" y="212" width="400" height="78" rx="12" fill="#ff8c42"/>
  <text x="130" y="238" font-size="14" font-weight="700" fill="#fff">2 · Switch (optional)</text>
  <text x="130" y="260" font-size="11" fill="#fff3e8">Value: {{ $json.query.action }}</text>
  <text x="130" y="276" font-size="11" fill="#fff3e8">start_campaign | send_followup_1..4 | stop_campaign</text>

  <line x1="310" y1="290" x2="310" y2="330" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="316" font-size="10" fill="#888">start branch</text>

  <!-- Node 3 HTTP Request -->
  <rect x="110" y="332" width="400" height="88" rx="12" fill="#2f80ed"/>
  <text x="130" y="358" font-size="14" font-weight="700" fill="#fff">3 · HTTP Request — load mails</text>
  <text x="130" y="380" font-size="11" fill="#e6f0ff">GET https://PUBLIC-API/api/mails?campaignId={{ $('Webhook').item.json.query.campaignId }}</text>
  <text x="130" y="396" font-size="11" fill="#e6f0ff">Header: Authorization = Bearer <JWT from POST /api/auth/signin></text>
  <text x="130" y="412" font-size="11" fill="#e6f0ff">Response: { "data": [ { "email", "full_name", ... } ] }</text>

  <line x1="310" y1="420" x2="310" y2="460" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 4 Split Out -->
  <rect x="110" y="462" width="400" height="78" rx="12" fill="#00b5a5"/>
  <text x="130" y="488" font-size="14" font-weight="700" fill="#fff">4 · Split Out</text>
  <text x="130" y="510" font-size="11" fill="#e2fffc">Field to Split Out: data</text>
  <text x="130" y="526" font-size="11" fill="#e2fffc">→ creates one item per recipient</text>

  <line x1="310" y1="540" x2="310" y2="580" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 5 Edit Fields -->
  <rect x="110" y="582" width="400" height="118" rx="12" fill="#7c6cf0"/>
  <text x="130" y="608" font-size="14" font-weight="700" fill="#fff">5 · Edit Fields (Set)</text>
  <text x="130" y="630" font-size="11" fill="#efeaff">campaignId  → {{ $('Webhook').item.json.query.campaignId }}</text>
  <text x="130" y="648" font-size="11" fill="#efeaff">email / full_name  → {{ $json.email }} / {{ $json.full_name }}</text>
  <text x="130" y="666" font-size="11" fill="#efeaff">workMail / action → from webhook query</text>
  <text x="130" y="684" font-size="11" fill="#efeaff">subject / body → campaign copy · status → queued</text>

  <line x1="310" y1="700" x2="310" y2="740" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 6 Google Sheets Append -->
  <rect x="110" y="742" width="400" height="88" rx="12" fill="#34a853"/>
  <text x="130" y="768" font-size="14" font-weight="700" fill="#fff">6 · Google Sheets — Append Row</text>
  <text x="130" y="790" font-size="11" fill="#e6f7ea">Credential: Google Sheets OAuth2</text>
  <text x="130" y="806" font-size="11" fill="#e6f7ea">Document: spreadsheet ID · Sheet: NOVA</text>
  <text x="130" y="822" font-size="11" fill="#e6f7ea">Map columns to the Set fields (one row per user)</text>

  <line x1="310" y1="830" x2="310" y2="870" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 7 Split In Batches -->
  <rect x="110" y="872" width="400" height="88" rx="12" fill="#9b51e0"/>
  <text x="130" y="898" font-size="14" font-weight="700" fill="#fff">7 · Split In Batches (recommended)</text>
  <text x="130" y="920" font-size="11" fill="#f3e6ff">Batch size: 10</text>
  <text x="130" y="936" font-size="11" fill="#f3e6ff">Optional Wait 2s between batches (Gmail daily limit)</text>
  <text x="130" y="952" font-size="11" fill="#f3e6ff">Skip for 2–3 test emails</text>

  <line x1="310" y1="960" x2="310" y2="1000" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 8 Gmail -->
  <rect x="110" y="1002" width="400" height="88" rx="12" fill="#EA4B71"/>
  <text x="130" y="1028" font-size="14" font-weight="700" fill="#fff">8 · Gmail — Send</text>
  <text x="130" y="1050" font-size="11" fill="#ffe">Credential: Gmail OAuth2 for workMail account</text>
  <text x="130" y="1066" font-size="11" fill="#ffe">To: {{ $json.email }} · Subject: {{ $json.subject }}</text>
  <text x="130" y="1082" font-size="11" fill="#ffe">Message: {{ $json.body }} (runs once per item)</text>

  <line x1="310" y1="1090" x2="310" y2="1130" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 9 Sheets Update -->
  <rect x="110" y="1132" width="400" height="88" rx="12" fill="#f2b705"/>
  <text x="130" y="1158" font-size="14" font-weight="700" fill="#141414">9 · Google Sheets — Update (optional)</text>
  <text x="130" y="1180" font-size="11" fill="#4a3b00">Match on email (and campaignId if possible)</text>
  <text x="130" y="1196" font-size="11" fill="#4a3b00">status = sent · sent_at = {{ $now.toISO() }}</text>

  <!-- Loop back arrow -->
  <path d="M 526 1176 L 570 1176 L 570 916 L 526 916" fill="none" stroke="#9b51e0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="582" y="1050" font-size="10" fill="#9b51e0" transform="rotate(90 582 1050)">loop batch</text>

  <line x1="310" y1="1220" x2="310" y2="1256" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 10 Publish -->
  <rect x="110" y="1258" width="400" height="70" rx="12" fill="#1a1a2e"/>
  <text x="130" y="1286" font-size="14" font-weight="700" fill="#fff">10 · Save → Publish</text>
  <text x="130" y="1308" font-size="11" fill="#aab">Workflow must stay published for the /webhook/ production URL</text>

  <text x="310" y="1368" text-anchor="middle" font-size="11" fill="#888">stop / status branches connect to Switch but send no Gmail</text>
</svg>
